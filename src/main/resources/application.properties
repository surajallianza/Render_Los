# ===================================================================
# Allianza LOS - Database & Flyway Architecture Configuration
# ===================================================================

spring.application.name=allianza-los
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Automatically import .env file from project root if present
spring.config.import=optional:file:.env[.properties]

# Disable default Spring Boot single-datasource Flyway auto-migration
# DatabaseMigrationService explicitly orchestrates Setup and Bank migrations
spring.flyway.enabled=false

# Flyway exclusively manages database schema; disable Hibernate DDL execution
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Set migration to run automatically on application startup
app.migration.auto-run=true

# -------------------------------------------------------------------
# 1. Setup Database Configuration
# -------------------------------------------------------------------
app.datasource.setup.url=${SETUP_DB_URL:jdbc:postgresql://localhost:5432/bank_setup}
app.datasource.setup.jdbc-url=${SETUP_DB_URL:jdbc:postgresql://localhost:5432/bank_setup}
app.datasource.setup.username=${SETUP_DB_USERNAME:postgres}
app.datasource.setup.password=${SETUP_DB_PASSWORD:postgres}
app.datasource.setup.driver-class-name=org.postgresql.Driver

# Setup Connection Pool (HikariCP)
app.datasource.setup.pool-name=SetupHikariPool
app.datasource.setup.maximum-pool-size=10
app.datasource.setup.minimum-idle=2
app.datasource.setup.idle-timeout=300000
app.datasource.setup.connection-timeout=20000
app.datasource.setup.max-lifetime=1200000

# Setup Flyway Settings
app.flyway.setup.location=classpath:db/migration/setup
app.flyway.setup.table=flyway_schema_history_setup
app.flyway.setup.baseline-version=1
app.flyway.setup.baseline-description=Initial Setup Schema

# -------------------------------------------------------------------
# 2. Bank Database Configuration
# -------------------------------------------------------------------
app.datasource.bank.url=${BANK_DB_URL:}
app.datasource.bank.jdbc-url=${BANK_DB_URL:}
app.datasource.bank.username=${BANK_DB_USERNAME:${app.datasource.setup.username:postgres}}
app.datasource.bank.password=${BANK_DB_PASSWORD:${app.datasource.setup.password:postgres}}
app.datasource.bank.driver-class-name=org.postgresql.Driver

# Bank Connection Pool (HikariCP)
app.datasource.bank.pool-name=BankHikariPool
app.datasource.bank.maximum-pool-size=20
app.datasource.bank.minimum-idle=5
app.datasource.bank.idle-timeout=300000
app.datasource.bank.connection-timeout=20000
app.datasource.bank.max-lifetime=1200000

# Bank Flyway Settings
app.flyway.bank.location=classpath:db/migration/bank
app.flyway.bank.table=flyway_schema_history_bank
app.flyway.bank.baseline-version=1
app.flyway.bank.baseline-description=Initial Bank Schema

# -------------------------------------------------------------------
# CORS Configuration
# -------------------------------------------------------------------
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000,http://127.0.0.1:5173,http://192.168.0.142:3000,http://192.168.0.136:3000,http://192.168.0.130:3000,http://192.168.0.156:3000}

# -------------------------------------------------------------------
# Logging Configuration
# -------------------------------------------------------------------
logging.level.com.allianza.los=INFO
logging.level.org.flywaydb=INFO

# -------------------------------------------------------------------
# Document Storage Configuration
# -------------------------------------------------------------------
# Folder where customer documents are stored. Works on every machine without changes:
#  - not set           -> <your user home>/uploads/customer-documents (e.g. C:/Users/<you>/uploads/customer-documents)
#  - set in .env       -> CUSTOMER_DOCUMENTS_PATH=D:/los-files   (absolute)
#                         CUSTOMER_DOCUMENTS_PATH=~/los-files    (~ = your user home)
#                         CUSTOMER_DOCUMENTS_PATH=uploads        (relative to the folder the app is started from)
# The database stores only paths relative to this folder, so it can be changed or moved safely.
storage.customer-documents.path=${CUSTOMER_DOCUMENTS_PATH:${user.home}/uploads/customer-documents}

# Upload limits: one document per request, max 5 MB (matches the frontend limit).
# Spring's defaults are 1 MB per file / 10 MB per request.
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Onboarding document rules (Document Type sub lookup codes, comma separated)
# required-types: types that must be uploaded before Submit, e.g. PAN,AADHAAR,PHOTO
# multiple-allowed-types: types that can have several files (others are replaced on re-upload)
# min-count: minimum number of documents (any type) needed to Submit
app.customer.documents.required-types=${CUSTOMER_REQUIRED_DOCUMENT_TYPES:}
app.customer.documents.multiple-allowed-types=${CUSTOMER_MULTIPLE_DOCUMENT_TYPES:}
app.customer.documents.min-count=${CUSTOMER_MIN_DOCUMENT_COUNT:1}

# 
# Customer Onboarding Lookups
# Lookups are resolved dynamically by category name from the database (m001 table).
# No hardcoded lookup codes are required.
# -------------------------------------------------------------------

# -------------------------------------------------------------------
# Customer Security & Document Encryption
# Master secret, AES secret, and HMAC secret are sourced exclusively from environment variables or external config.
# Outside 'dev' profile, the application will refuse to start if master-secret is missing.
# -------------------------------------------------------------------
app.customer.security.master-secret=${CUSTOMER_MASTER_SECRET:}
app.customer.security.aes-secret=${CUSTOMER_AES_SECRET:}
app.customer.security.hmac-secret=${CUSTOMER_HMAC_SECRET:}
app.customer.security.document-key-version=${CUSTOMER_DOCUMENT_KEY_VERSION:1}
app.customer.security.document-encryption-enabled=${CUSTOMER_DOCUMENT_ENCRYPTION_ENABLED:true}
app.customer.security.allow-legacy-plaintext-documents=${ALLOW_LEGACY_PLAINTEXT_DOCS:false}

# -------------------------------------------------------------------
# JWT Authentication Configuration (24 Hours for Development)
# -------------------------------------------------------------------
app.jwt.access-token-validity-seconds=${JWT_ACCESS_TOKEN_VALIDITY_SECONDS:86400}
app.jwt.refresh-token-validity-seconds=${JWT_REFRESH_TOKEN_VALIDITY_SECONDS:604800}



# -------------------------------------------------------------------
# Rule Engine: Lookup Master categories behind the Check / When value is / Then
# dropdowns (lookup name or code). Their values are managed in Lookup Management.
# -------------------------------------------------------------------
app.rule-engine.lookups.parameter=${RULE_PARAMETER_LOOKUP:Rule Parameter}
app.rule-engine.lookups.operator=${RULE_OPERATOR_LOOKUP:Rule Operator}
app.rule-engine.lookups.decision=${RULE_DECISION_LOOKUP:Rule Decision}
